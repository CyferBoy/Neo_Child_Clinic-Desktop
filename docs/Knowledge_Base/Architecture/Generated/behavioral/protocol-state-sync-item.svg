<text x="70" y="470" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" fill="#78716c" text-anchor="start" font-weight="400">Protocol constrains accepted events per state; a stale SYNCING may be requeued by the 5-minute guard without counting a failure.</text>
